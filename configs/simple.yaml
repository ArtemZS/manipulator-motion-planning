name: simple_3d_obstacles
scene_revision: 2
title: Перенос к цели между стойками
description: >-
  Шесть препятствий: центральная сфера, два низких блока, внешняя сфера
  и две стойки вокруг целевой точки. Нужно обойти центральную группу,
  а затем опустить инструмент в свободный промежуток между стойками.
safety_margin: 0.015
# Радианы. Прямой поворот основания пересекает центральную красную сферу.
start: [-0.85, -0.10, 0.25, 0.10, -0.15, 0.10]
goal: [0.85, 0.05, 0.10, -0.10, 0.15, -0.10]
# Известный допустимый обход нужен только тестам и не передаётся в RRT*.
diagnostic_detour:
  - [-0.85, -0.10, 0.25, 0.10, -0.15, 0.10]
  - [-0.85, -0.90, 0.25, 0.10, -0.15, 0.10]
  - [0.85, -0.90, 0.10, -0.10, 0.15, -0.10]
  - [0.85, 0.05, 0.10, -0.10, 0.15, -0.10]
obstacles:
  - name: central_sphere
    kind: sphere
    position: [0.64, 0.0, 0.37]
    radius: 0.13
  - name: low_box
    kind: box
    position: [0.20, 0.48, 0.12]
    half_size: [0.10, 0.09, 0.12]
  # Цель инструмента находится в (0.770, 0.871, 0.228) м между этими стойками.
  # Ширина свободного промежутка по x равна 0.33 м, без искусственно узкого зазора.
  - name: goal_left_post
    kind: box
    position: [0.53, 0.97, 0.25]
    half_size: [0.07, 0.13, 0.25]
  - name: goal_right_post
    kind: box
    position: [1.00, 0.97, 0.25]
    half_size: [0.07, 0.13, 0.25]
  - name: middle_block
    kind: box
    position: [0.80, -0.27, 0.18]
    half_size: [0.15, 0.09, 0.18]
  - name: outer_ball
    kind: sphere
    position: [1.08, 0.20, 0.48]
    radius: 0.14
