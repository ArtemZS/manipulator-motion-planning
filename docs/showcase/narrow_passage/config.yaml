name: narrow_passage
title: Складывание локтя и проход через окно
description: Тонкая сплошная стена перекрывает внешние обходы. Манипулятор сначала
  складывает локоть, разворачивается перед окном и проводит инструмент через проём
  шириной 0.32 м. Начальная конфигурация почти вытянута; конечное сгибание локтя составляет
  74.5 градуса.
